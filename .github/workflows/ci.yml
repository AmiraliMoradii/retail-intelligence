name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE_PATH: ${{ format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run benchmark:forecast
      - name: Build the self-hosted preview
        run: npm run build -- --outDir dist/store
        env:
          VITE_STORE_INVENTORY: "1"
      - name: Build the public demo
        run: npm run build -- --base "$PAGES_BASE_PATH" --outDir dist/demo
        env:
          VITE_PUBLIC_DEMO: "1"
      - run: npx playwright install --with-deps chromium
      - run: npx playwright install chrome
      - name: Test desktop, mobile, and synthetic video playback
        id: browser-tests
        run: npm run test:e2e
      - name: Save browser failure diagnostics
        if: failure() && steps.browser-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
      - name: Upload the tested public demo
        if: github.repository == 'AmiraliMoradii/retail-intelligence' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/demo

  deploy:
    if: github.repository == 'AmiraliMoradii/retail-intelligence' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
